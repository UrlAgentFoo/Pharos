# yaml-language-server: $schema=../../packages/contracts/schemas/book.schema.json
id: cell-tracking
version: 0.1.0
title: Track cells in a time-lapse
summary: Segments nuclei in every frame with Cellpose, links them into tracks with Ultrack, measures each cell over time, and makes a video of the tracks.
tags: [microscopy, tracking, time-lapse, 3d+t, nuclei, migration, lineage]
authors: [Pharos]
ships: { bio-utils: ^0.1, cellpose: ^0.1, ultrack: ^0.1, render: ^0.1 }
inputs:
  - name: movie
    description: A fluorescence time-lapse of nuclei, 2D or 3D over time (at least 2 time points).
    accepts: { kind: volume, axes: tyx, edam: data_2968 }
parameters:
  - { name: diameter, label: Nucleus diameter, type: number, unit: px, default: 30, min: 0, max: 500, description: "Typical nucleus diameter in x/y pixels; 0 lets Cellpose estimate it.", sets: segment.diameter }
  - { name: model, label: Model, type: enum, options: [nuclei, cyto3], default: nuclei, description: "nuclei for nuclear stains, cyto3 for whole cells.", sets: segment.model }
  - { name: channel, label: Channel, type: integer, default: 0, min: 0, max: 16, description: "The channel with the nuclear stain, counting from 0.", sets: [segment.channel, render.channel] }
  - { name: max_distance, label: Largest move between frames, type: number, default: 15, min: 0, description: "In physical units (usually µm): how far a cell can move from one time point to the next.", sets: track.max_distance }
  - { name: min_size, label: Smallest cell, type: integer, default: 50, min: 1, description: "In voxels: smaller objects are ignored as debris.", sets: track.min_size }
steps:
  - { id: convert, run: bio-utils.convert, in: { image: $movie } }
  - { id: segment, run: cellpose.segment, in: { image: convert.zarr } }
  - { id: track, run: ultrack.track, in: { labels: segment.masks } }
  - { id: measure, run: bio-utils.measure, in: { labels: track.labels, image: convert.zarr } }
  - { id: render, run: render.tracks-video, in: { image: convert.zarr, tracks: track.tracks } }
outputs: { tracks: track.tracks, table: measure.table, video: render.video, labels: track.labels }
