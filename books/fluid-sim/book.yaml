# yaml-language-server: $schema=../../packages/contracts/schemas/book.schema.json
id: fluid-sim
version: 0.1.0
title: Simulate flow past an obstacle
summary: Runs an OpenFOAM case (such as air or water flowing past an obstacle) at the speed you choose, and makes a video of the vortices or speed.
tags: [cfd, simulation, fluid-dynamics, openfoam, vortices, flow]
authors: [Pharos]
ships: { openfoam: ^0.1, render: ^0.1 }
inputs:
  - name: case
    description: An OpenFOAM case folder (system/, constant/, 0/), with its inflow patch named "inlet".
    accepts: { kind: sim-case, formats: [openfoam-case] }
parameters:
  - { name: speed, label: Inlet speed, type: number, unit: m/s, default: 1, min: 0, max: 100, description: "How fast the fluid enters; with the example case, Reynolds number = 100 × speed.", sets: solve.speed }
  - { name: end_time, label: Simulated time, type: number, unit: s, default: 60, min: 0.01, max: 100000, description: "How long to simulate; vortices take about 20-30 s to develop in the example.", sets: solve.end_time }
  - { name: field, label: Show, type: enum, options: [vorticity, speed], default: vorticity, description: "vorticity shows the swirling vortices; speed shows how fast the fluid moves.", sets: render.field }
steps:
  - { id: solve, run: openfoam.solve, in: { case: $case } }
  - { id: render, run: render.flow-video, in: { case: solve.case } }
outputs: { case: solve.case, video: render.video }
