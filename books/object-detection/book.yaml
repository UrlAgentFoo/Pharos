# yaml-language-server: $schema=../../packages/contracts/schemas/book.schema.json
id: object-detection
version: 0.1.0
title: Object detection
summary: Finds and outlines the people, vehicles, animals and everyday things (the 80 COCO classes) in photos and videos with Ultralytics YOLO, each object its own label or drawn on the video, with a table of what it found where; or what your own trained YOLO weights know.
how_to_use: Open a photo (as a TIFF) or a video. Find the people, vehicles, animals and everyday things in it, each one outlined and listed in a table you can count.
tags: [object-detection, detection, segmentation, instance-segmentation, yolo, coco, counting, people, cars, vehicles, animals, photos, video, street, traffic]
authors: [Pharos]
ships: { yolo: ^0.2 }
actions:
  find_in_image:
    title: Find objects in an image
    summary: Finds every object YOLO knows in the image (each z slice and time point of a stack), outlines each as its own label, and lists its class, confidence, box and area in a table.
    inputs:
      - name: image
        description: A photo or other image, 2D or a stack; colour photos as 8-bit RGB TIFF.
        accepts: { kind: volume, formats: [tiff, ome-tiff, ome-zarr] }
    parameters:
      - { name: classes, label: Classes, type: string, default: "", description: "The classes to keep, separated by commas (person, car); empty keeps every class.", sets: segment.classes }
      - { name: confidence, label: Confidence, type: number, default: 0.25, min: 0.01, max: 1, description: "How sure it must be to keep an object: lower finds more, with more mistakes.", sets: segment.confidence }
      - { name: model, label: Model, type: enum, options: [nano, small, medium], default: nano, description: "nano is fastest, medium finds the most.", sets: segment.model }
      - { name: size, label: Image size, type: integer, unit: px, default: 640, min: 160, max: 1920, description: "The size the image is scaled to for the model: larger finds smaller objects, more slowly.", sets: segment.size }
      - { name: weights, label: Your weights, type: string, default: "", description: "The file name of YOLO segmentation weights you trained, in ~/Pharos/weights; empty uses the model above.", sets: segment.weights }
      - { name: channel, label: Channel, type: integer, default: -1, min: -1, max: 16, description: "The channel to look at, counting from 0; -1 uses the first three as colour.", sets: segment.channel }
    controls:
      - { title: Objects, note: "Name the classes to keep, or leave it empty for every one the model knows.", params: [classes, confidence] }
      - { title: Model, note: "A larger model or image size finds more and smaller objects, more slowly.", params: [model, size] }
    steps:
      - { id: segment, run: yolo.segment, in: { image: $image } }
    outputs: { masks: segment.masks, objects: segment.objects }
  find_in_video:
    title: Find objects in a video
    summary: Finds the objects YOLO knows in the video's frames and makes a new video with each one outlined and named, with a table of what it found in each frame.
    inputs:
      - name: video
        description: A video (MP4 or MOV) of a street, a room, animals or anything else with everyday objects in it.
        accepts: { kind: video, formats: [mp4, mov] }
    parameters:
      - { name: classes, label: Classes, type: string, default: "", description: "The classes to keep, separated by commas (person, car); empty keeps every class.", sets: segment.classes }
      - { name: confidence, label: Confidence, type: number, default: 0.25, min: 0.01, max: 1, description: "How sure it must be to keep an object: lower finds more, with more mistakes.", sets: segment.confidence }
      - { name: fps, label: Frames per second, type: number, default: 10, min: 0, max: 120, description: "How many frames a second to look at, and the new video's frame rate; 0 looks at every frame.", sets: segment.fps }
      - { name: max_size, label: Largest frame side, type: integer, unit: px, default: 1280, min: 160, max: 4096, description: "Frames with a longer side than this are scaled down first, in the new video too.", sets: segment.max_size }
      - { name: model, label: Model, type: enum, options: [nano, small, medium], default: nano, description: "nano is fastest, medium finds the most.", sets: segment.model }
      - { name: size, label: Image size, type: integer, unit: px, default: 640, min: 160, max: 1920, description: "The size each frame is scaled to for the model: larger finds smaller objects, more slowly.", sets: segment.size }
      - { name: weights, label: Your weights, type: string, default: "", description: "The file name of YOLO segmentation weights you trained, in ~/Pharos/weights; empty uses the model above.", sets: segment.weights }
    controls:
      - { title: Objects, note: "Name the classes to keep, or leave it empty for every one the model knows.", params: [classes, confidence] }
      - { title: Frames, note: "Fewer frames a second is quicker; the new video plays at that rate.", params: [fps, max_size] }
      - { title: Model, note: "A larger model or image size finds more and smaller objects, more slowly.", params: [model, size] }
    steps:
      - { id: segment, run: yolo.segment-video, in: { video: $video } }
    outputs: { video: segment.video, objects: segment.objects }
