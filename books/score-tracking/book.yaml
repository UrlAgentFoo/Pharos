# yaml-language-server: $schema=../../packages/contracts/schemas/book.schema.json
id: score-tracking
version: 0.1.0
title: Track nuclei and score against ground truth
summary: Tracks nuclei in a 3D light-sheet time-lapse with the detector-free Space Time Field tracker, scores the tracks against ground-truth tracks (GEFF) with the Biohub challenge's edge-Jaccard metric, and makes a video of the tracks.
tags: [microscopy, tracking, light-sheet, 3d+t, nuclei, ground-truth, evaluation, benchmark, geff, biohub, kaggle]
authors: [Pharos]
ships: { space-time-field: ^0.1, geff: ^0.1 }
inputs:
  - name: movie
    description: A 3D fluorescence time-lapse of nuclei (t, z, y, x), e.g. a Biohub challenge video's .zarr.
    accepts: { kind: volume, axes: tzyx, edam: data_2968 }
  - name: truth
    description: Ground-truth tracks for the same movie as a GEFF graph, e.g. the .geff beside the challenge's .zarr (it may be sparse).
    accepts: { kind: tracks, formats: [geff] }
parameters:
  - { name: num_dog, label: DoG bands, type: integer, default: 2, min: 1, max: 3, description: "1 looks for one nucleus size; 2 also finds smaller nuclei (more recall, a few more false tracks).", sets: track.num_dog }
  - { name: temporal_radius, label: Frames pooled, type: integer, default: 2, min: 0, max: 8, description: "Neighbouring frames on each side pooled into each frame: more ignores flicker but blurs fast cells.", sets: track.temporal_radius }
  - { name: value_floor, label: Detection floor, type: number, default: 0.0175, min: 0, max: 1, description: "Raise it to drop dim false detections.", sets: track.value_floor }
  - { name: lambda_termination, label: Track end cost, type: number, default: 0.6, min: 0, description: "Higher keeps tracks whole rather than ending them inside the view.", sets: track.lambda_termination }
  - { name: channel, label: Channel, type: integer, default: 0, min: 0, max: 16, description: "The channel with the nuclear stain, counting from 0.", sets: [track.channel, video.channel] }
  - { name: max_distance, label: Match distance, type: number, unit: µm, default: 7, min: 0, max: 100, description: "How close a tracked cell must be to a true cell to count as it.", sets: score.max_distance }
  - { name: split, label: Held-out from, type: integer, default: 50, min: 0, description: "First time point of the held-out part of the score; 0 halves the movie.", sets: score.split }
steps:
  - { id: track, run: space-time-field.track, in: { movie: $movie } }
  - { id: score, run: geff.score, in: { tracks: track.tracks, truth: $truth } }
  - { id: video, run: space-time-field.tracks-video, in: { image: $movie, tracks: track.tracks } }
outputs: { tracks: track.tracks, score: score.score, video: video.video }
