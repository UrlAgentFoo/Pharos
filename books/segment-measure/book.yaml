# yaml-language-server: $schema=../../packages/contracts/schemas/book.schema.json
id: segment-measure
version: 0.1.0
title: Segment and measure nuclei
summary: Finds every nucleus (or cell) in a 2D or 3D image with Cellpose, measures each one - its volume, position and brightness - in a table, and shows them in 3D.
tags: [microscopy, segmentation, measurement, nuclei, cells, counting]
authors: [Pharos]
ships: { bio-utils: ^0.1, cellpose: ^0.1, render: ^0.1 }
inputs:
  - name: image
    description: A fluorescence image of nuclei or cells, 2D or 3D (time-lapses are measured frame by frame).
    accepts: { kind: volume, edam: data_2968 }
parameters:
  - { name: diameter, label: Object diameter, type: number, unit: px, default: 30, min: 0, max: 500, description: "Typical object diameter in x/y pixels; 0 lets Cellpose estimate it.", sets: segment.diameter }
  - { name: model, label: Model, type: enum, options: [nuclei, cyto3], default: nuclei, description: "nuclei for nuclear stains, cyto3 for whole cells.", sets: segment.model }
  - { name: channel, label: Channel, type: integer, default: 0, min: 0, max: 16, description: "The channel with the stain to segment, counting from 0.", sets: segment.channel }
steps:
  - { id: convert, run: bio-utils.convert, in: { image: $image } }
  - { id: segment, run: cellpose.segment, in: { image: convert.zarr } }
  - { id: measure, run: bio-utils.measure, in: { labels: segment.masks, image: convert.zarr } }
  - { id: surface, run: render.labels-surface, in: { labels: segment.masks } }
outputs: { masks: segment.masks, table: measure.table, model: surface.model }
