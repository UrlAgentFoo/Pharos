[package]
name = "pharos-kernels"
version = "0.1.0"
edition = "2021"
description = "Pharos pixel kernels, compiled to WebAssembly (browser + Node) and testable natively."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
