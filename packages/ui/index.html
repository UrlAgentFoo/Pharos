<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pharos</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%232b2a27'/%3E%3Cg stroke='%23f3f0eb' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12.5 9 16 6.5 19.5 9Z'/%3E%3Cpath d='M13.5 9v3.5h5V9'/%3E%3Cpath d='M12.5 12.5h7'/%3E%3Cpath d='M14 12.5 12.5 24.5h7L18 12.5'/%3E%3Cpath d='M13.2 18.5h5.6'/%3E%3Cpath d='M10 24.5h12'/%3E%3Cpath d='M10.5 10.2 7 9.2M21.5 10.2l3.5-1'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar" id="toolbar" aria-label="Pharos"></header>

    <main class="desktop" id="desktop">
      <!-- the left column, full height: the conversation, scrolling under its top, over the input -->
      <div class="assistant-col">
        <!-- the assistant: the project's name, then the conversation -->
        <aside class="assistant" id="assistant" aria-label="Assistant"></aside>
        <!-- ask the assistant, or search actions and windows; it stays when the conversation is hidden -->
        <div class="ask-box" id="ask-box"></div>
      </div>
      <!-- bottom right: the project -->
      <div class="project-bar" id="project-bar">
        <button class="tb-text" data-action="save-project" title="Save the project (windows, their histories and layout) as one .pharos file"></button>
        <button class="tb-text" data-action="open-project" title="Open a .pharos project file"></button>
        <button class="tb-text" data-action="clear-project" title="Start a new, empty project (your data on disk is kept)"></button>
      </div>

      <div class="welcome" id="welcome">
        <!-- the drop area in the middle of a ring of example cards, which turns slowly; "See all examples"
             lays the cards out in a grid under the drop area instead, with "Hide examples" at its foot -->
        <div class="welcome-stage" id="welcome-stage">
          <!-- in the ring, one fixed-size scene scaled as a whole to fit, so zooming changes its size, never the view -->
          <div class="ring-scene" id="ring-scene">
            <div class="welcome-centre">
              <h1 class="display">Drop your data.</h1>
              <p class="chat-warn" id="no-server" hidden>Pharos runs its tools on this computer through its local server. Start it with <code>npx pharos-lab</code> and open the address it prints.</p>
              <button class="dropzone" data-action="add-data">
                <span class="dropzone-icon" id="dropzone-icon"></span>
                <span class="dropzone-title">Drag your files here to begin</span>
                <span class="dropzone-sub">microscopy images and time-lapses, simulation cases, videos, tables · or click to choose</span>
              </button>
              <div class="examples-actions">
                <button class="icon-btn" data-turn="-1" aria-label="Turn the examples back" title="Turn the examples back" hidden></button>
                <button class="tb-text" id="examples-more" aria-expanded="false" aria-controls="example-list" hidden>See all examples</button>
                <button class="icon-btn" data-turn="1" aria-label="Turn the examples on" title="Turn the examples on" hidden></button>
              </div>
            </div>
            <section class="examples" id="examples" aria-label="Examples to try">
              <div class="example-list" id="example-list"></div>
              <button class="tb-text examples-hide" id="examples-toggle" aria-controls="example-list" hidden>Hide examples</button>
            </section>
          </div>
        </div>
      </div>

      <!-- bottom centre, between the ask box and the project buttons; windows can cover it -->
      <p class="desk-hint"><kbd>Tab</kbd> shows every window</p>

      <!-- top right: the project's name, always; click it to name the project -->
      <button class="project-label" id="project-label" title="Click to name the project">Pharos · <span>New project</span></button>
      <input class="project-label-input" id="project-label-input" aria-label="Project name" placeholder="Name this project" spellcheck="false" hidden />
    </main>

    <div class="busy" id="busy" hidden>Working…</div>
    <div class="toast" id="toast" role="status" hidden></div>

    <div class="drop-overlay" id="drop" hidden><div><span id="drop-icon"></span><p id="drop-text">Drop to add your data</p></div></div>
    <input type="file" id="project-input" accept=".pharos,.zip,application/zip" hidden />
    <dialog id="dialog"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
