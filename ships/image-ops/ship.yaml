# yaml-language-server: $schema=../../packages/contracts/schemas/ship.schema.json
id: image-ops
version: 0.1.0
image: pharos/image-ops:0.1.0    # built from this folder's Dockerfile
summary: Everyday image processing - invert, blur, flip, rotate, set the scale, threshold to a mask, binary operations, particle analysis and measurements.
license: MIT
tags: [microscopy, image-processing, filters, threshold, binary, morphology, measurement, particles]
requires: { memory_gb: 4, network: none }
# quick, frequent operations: one container stays up, with scikit-image already imported
mode: warm
warm: { start: python /opt/pharos/pharos_warm.py serve /opt/pharos/pharos_image.py }
operations:
  invert:
    summary: Inverts an image, so bright becomes dark (8-bit over 0-255, other types over their own range).
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py invert --image {in.image}
    inputs: [{ name: image, kind: volume, formats: [tiff, ome-tiff, ome-zarr] }]
    outputs: [{ name: image, kind: volume, format: ome-zarr, path: /out/image.zarr }]
    cache: { deterministic: true }
  gaussian-blur:
    summary: Smooths an image with a Gaussian, to reduce noise before a threshold; in 3D when given a z sigma.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py gaussian-blur --image {in.image} --sigma {sigma} --sigma-z {sigma_z}
    inputs: [{ name: image, kind: volume, formats: [tiff, ome-tiff, ome-zarr] }]
    parameters:
      - { name: sigma, type: number, unit: px, default: 2, min: 0.1, max: 100, description: "Blur radius (standard deviation) in x and y pixels." }
      - { name: sigma_z, type: number, unit: px, default: 0, min: 0, max: 100, description: "Blur radius along z, in slices; 0 blurs each slice on its own." }
    outputs: [{ name: image, kind: volume, format: ome-zarr, path: /out/image.zarr }]
    cache: { deterministic: true }
  flip:
    summary: Mirrors an image left to right (horizontal) or top to bottom (vertical).
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py flip --image {in.image} --direction {direction}
    inputs: [{ name: image, kind: volume, formats: [tiff, ome-tiff, ome-zarr] }]
    parameters:
      - { name: direction, type: enum, options: [horizontal, vertical], default: horizontal, description: "horizontal mirrors left to right; vertical, top to bottom." }
    outputs: [{ name: image, kind: volume, format: ome-zarr, path: /out/image.zarr }]
    cache: { deterministic: true }
  rotate:
    summary: Rotates an image by 90 degrees, to the right (clockwise) or the left.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py rotate --image {in.image} --direction {direction}
    inputs: [{ name: image, kind: volume, formats: [tiff, ome-tiff, ome-zarr] }]
    parameters:
      - { name: direction, type: enum, options: [right, left], default: right, description: "right turns clockwise; left, anticlockwise." }
    outputs: [{ name: image, kind: volume, format: ome-zarr, path: /out/image.zarr }]
    cache: { deterministic: true }
  set-scale:
    summary: Sets an image's pixel size (and slice spacing), so areas and lengths come out in physical units.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py set-scale --image {in.image} --pixel-size {pixel_size} --z-size {z_size} --unit {unit}
    inputs: [{ name: image, kind: volume, formats: [tiff, ome-tiff, ome-zarr] }]
    parameters:
      - { name: pixel_size, type: number, default: 1, min: 0.000001, description: "Size of one pixel in x and y, in the unit below." }
      - { name: z_size, type: number, default: 0, min: 0, description: "Spacing between slices in the same unit; 0 keeps what the image has." }
      - { name: unit, type: enum, options: [µm, nm, mm], default: µm, description: Unit of the sizes. }
    outputs: [{ name: image, kind: volume, format: ome-zarr, path: /out/image.zarr }]
    cache: { deterministic: true }
  threshold:
    summary: Turns an image into a mask of its foreground, with an automatic threshold (Otsu, Li, triangle and others) per time point and channel.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py threshold --image {in.image} --method {method} --foreground {foreground}
    inputs: [{ name: image, kind: volume, formats: [tiff, ome-tiff, ome-zarr] }]
    parameters:
      - { name: method, type: enum, options: [otsu, li, triangle, yen, isodata, mean, minimum], default: otsu, description: "How the threshold is chosen; otsu suits most fluorescence, triangle dim objects on a dark background." }
      - { name: foreground, type: enum, options: [bright, dark], default: bright, description: "bright for fluorescent objects on a dark background; dark for dark objects (e.g. brightfield)." }
    outputs: [{ name: mask, kind: labels, format: ome-zarr, path: /out/mask.zarr }]
    cache: { deterministic: true }
  erode:
    summary: Shrinks the objects in a mask by removing pixels from their edges, slice by slice.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py erode --mask {in.mask} --iterations {iterations}
    inputs: [{ name: mask, kind: labels, formats: [ome-zarr] }]
    parameters:
      - { name: iterations, type: integer, default: 1, min: 1, max: 100, description: How many pixels to remove from each edge. }
    outputs: [{ name: mask, kind: labels, format: ome-zarr, path: /out/mask.zarr }]
    cache: { deterministic: true }
  dilate:
    summary: Grows the objects in a mask by adding pixels to their edges, slice by slice.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py dilate --mask {in.mask} --iterations {iterations}
    inputs: [{ name: mask, kind: labels, formats: [ome-zarr] }]
    parameters:
      - { name: iterations, type: integer, default: 1, min: 1, max: 100, description: How many pixels to add to each edge. }
    outputs: [{ name: mask, kind: labels, format: ome-zarr, path: /out/mask.zarr }]
    cache: { deterministic: true }
  open:
    summary: Erodes then dilates a mask - removes small specks and thin connections and keeps object size.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py open --mask {in.mask} --iterations {iterations}
    inputs: [{ name: mask, kind: labels, formats: [ome-zarr] }]
    parameters:
      - { name: iterations, type: integer, default: 1, min: 1, max: 100, description: How strongly to open (pixels). }
    outputs: [{ name: mask, kind: labels, format: ome-zarr, path: /out/mask.zarr }]
    cache: { deterministic: true }
  close:
    summary: Dilates then erodes a mask - fills small gaps and holes and keeps object size.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py close --mask {in.mask} --iterations {iterations}
    inputs: [{ name: mask, kind: labels, formats: [ome-zarr] }]
    parameters:
      - { name: iterations, type: integer, default: 1, min: 1, max: 100, description: How strongly to close (pixels). }
    outputs: [{ name: mask, kind: labels, format: ome-zarr, path: /out/mask.zarr }]
    cache: { deterministic: true }
  fill-holes:
    summary: Fills background regions completely enclosed by objects in a mask (e.g. hollow nuclei), slice by slice.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py fill-holes --mask {in.mask}
    inputs: [{ name: mask, kind: labels, formats: [ome-zarr] }]
    outputs: [{ name: mask, kind: labels, format: ome-zarr, path: /out/mask.zarr }]
    cache: { deterministic: true }
  outline:
    summary: Keeps only a one-pixel outline of each object in a mask.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py outline --mask {in.mask}
    inputs: [{ name: mask, kind: labels, formats: [ome-zarr] }]
    outputs: [{ name: mask, kind: labels, format: ome-zarr, path: /out/mask.zarr }]
    cache: { deterministic: true }
  skeletonize:
    summary: Thins the objects in a mask to one-pixel-wide lines, for lengths and branching (e.g. neurites).
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py skeletonize --mask {in.mask}
    inputs: [{ name: mask, kind: labels, formats: [ome-zarr] }]
    outputs: [{ name: mask, kind: labels, format: ome-zarr, path: /out/mask.zarr }]
    cache: { deterministic: true }
  particles:
    summary: Counts and measures every object in a mask, slice by slice - area, centroid, perimeter, circularity and mean intensity in the image - and labels each one.
    command: >-
      python /opt/pharos/pharos_image.py particles --mask {in.mask} --image {in.image}
      --min-size {min_size} --max-size {max_size} --exclude-edges {exclude_edges}
    inputs:
      - { name: mask, kind: labels, formats: [ome-zarr] }
      - { name: image, kind: volume, formats: [tiff, ome-tiff, ome-zarr] }
    parameters:
      - { name: min_size, type: integer, unit: px, default: 0, min: 0, description: "Smallest object to count, in pixels; smaller ones are ignored as debris." }
      - { name: max_size, type: integer, unit: px, default: 0, min: 0, description: "Largest object to count, in pixels; 0 for no limit." }
      - { name: exclude_edges, type: boolean, default: false, description: "Leave out objects touching the edge of the image (they are cut off)." }
    outputs:
      - { name: table, kind: table, format: csv, path: /out/particles.csv }
      - { name: labels, kind: labels, format: ome-zarr, path: /out/labels.zarr }
    cache: { deterministic: true }
  measure:
    summary: Measures every plane of an image - area, mean, standard deviation, minimum, maximum and integrated density - in physical units when the image has a scale.
    command: python /opt/pharos/pharos_warm.py run /opt/pharos/pharos_image.py measure --image {in.image}
    inputs: [{ name: image, kind: volume, formats: [tiff, ome-tiff, ome-zarr] }]
    outputs: [{ name: table, kind: table, format: csv, path: /out/measurements.csv }]
    cache: { deterministic: true }
