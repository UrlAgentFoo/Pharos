# yaml-language-server: $schema=../../packages/contracts/schemas/ship.schema.json
id: render
version: 0.1.0
image: pharos/render:0.1.0    # built from this folder's Dockerfile
summary: Makes videos from images over time - max projections, with tracks drawn over them.
license: MIT
tags: [visualization, video, tracking]
requires: { memory_gb: 2, network: none }
operations:
  video:
    summary: Makes an MP4 of an image over time, max-projected along z.
    command: python /opt/pharos/pharos_render.py video --image {in.image} --out /out/video.mp4 --fps {fps} --channel {channel}
    inputs: [{ name: image, kind: volume, formats: [ome-zarr] }]
    parameters:
      - { name: fps, type: number, default: 4, min: 0.5, max: 60, description: Frames per second. }
      - { name: channel, type: integer, default: 0, min: 0, description: Channel to show. }
    outputs: [{ name: video, kind: video, format: mp4, path: /out/video.mp4 }]
    cache: { deterministic: true }
  tracks-video:
    summary: Makes an MP4 of an image over time with each tracked cell's recent path drawn in its own colour.
    command: python /opt/pharos/pharos_render.py tracks-video --image {in.image} --tracks {in.tracks} --out /out/video.mp4 --fps {fps} --channel {channel} --tail {tail}
    inputs:
      - { name: image, kind: volume, formats: [ome-zarr] }
      - { name: tracks, kind: tracks, formats: [csv] }
    parameters:
      - { name: fps, type: number, default: 4, min: 0.5, max: 60, description: Frames per second. }
      - { name: channel, type: integer, default: 0, min: 0, description: Channel to show. }
      - { name: tail, type: integer, default: 10, min: 0, max: 1000, description: How many earlier time points of each path to draw. }
    outputs: [{ name: video, kind: video, format: mp4, path: /out/video.mp4 }]
    cache: { deterministic: true }
